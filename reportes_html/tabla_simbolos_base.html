<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tabla de Simbolos</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --bg:#050810;
            --panel:#0b1120;
            --border:#1d2942;

            --text:#d7e4ff;
            --muted:#7c95c9;

            --green:#22f08a;
            --cyan:#00d4ff;
            --blue:#4f8ef7;
            --purple:#a855f7;
            --amber:#f5a623;
            --red:#ff4d6a;
        }

        body{
            background:var(--bg);
            color:var(--text);
            font-family:'JetBrains Mono', monospace;
            min-height:100vh;
            padding:24px;
        }

        body::before{
            content:'';
            position:fixed;
            inset:0;
            background-image:
                linear-gradient(rgba(79,142,247,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79,142,247,.03) 1px, transparent 1px);
            background-size:40px 40px;
            pointer-events:none;
        }

        .container{
            max-width:1600px;
            margin:auto;
        }

        .header{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:20px;
            margin-bottom:20px;
        }

        .title{
            display:flex;
            align-items:center;
            gap:14px;
        }

        .icon{
            width:50px;
            height:50px;
            border-radius:12px;
            background:rgba(34,240,138,.08);
            border:1px solid rgba(34,240,138,.2);
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--green);
        }

        h1{
            font-family:'Syne', sans-serif;
            color:var(--green);
            font-size:24px;
            letter-spacing:.08em;
            text-transform:uppercase;
        }

        .subtitle{
            color:var(--muted);
            font-size:12px;
            margin-top:4px;
        }

        .badge{
            padding:8px 16px;
            border-radius:999px;
            background:rgba(34,240,138,.08);
            border:1px solid rgba(34,240,138,.2);
            color:var(--green);
            font-size:12px;
            letter-spacing:.06em;
        }

        .table-wrapper{
            overflow:auto;
            border:1px solid var(--border);
            border-radius:14px;
            background:var(--panel);
        }

        table{
            width:100%;
            border-collapse:collapse;
            min-width:1200px;
        }

        thead{
            background:#0e172b;
        }

        thead th{
            padding:14px;
            text-align:left;
            color:var(--muted);
            font-size:11px;
            letter-spacing:.12em;
            text-transform:uppercase;
            border-bottom:1px solid var(--border);
        }

        tbody tr{
            border-bottom:1px solid rgba(29,41,66,.6);
            transition:.15s;
        }

        tbody tr:hover{
            background:rgba(79,142,247,.05);
        }

        tbody td{
            padding:12px 14px;
            font-size:12px;
            color:var(--text);
        }

        .empty{
            text-align:center;
            padding:40px;
            color:var(--muted);
            font-size:13px;
        }

        ::-webkit-scrollbar{
            width:6px;
            height:6px;
        }

        ::-webkit-scrollbar-thumb{
            background:#24314f;
            border-radius:999px;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">

            <div class="icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="2"
                          stroke="currentColor" stroke-width="2"/>
                    <path d="M3 9H21" stroke="currentColor" stroke-width="2"/>
                    <path d="M9 21V9"  stroke="currentColor" stroke-width="2"/>
                </svg>
            </div>

            <div>
                <h1>Tabla de Simbolos</h1>
                <div class="subtitle">Historial completo del analizador</div>
            </div>

        </div>

        <!-- El marcador será reemplazado por Python -->
        <div class="badge" id="badge">{{BADGE}}</div>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Scope</th>
                    <th>Evento</th>
                    <th>Valor</th>
                    <th>Init</th>
                    <th># Asig</th>
                    <th># Usos</th>
                    <th>Linea</th>
                    <th>Columna</th>
                </tr>
            </thead>

            <!-- Las filas se insertan aquí -->
            <tbody id="tbody">
                {{FILAS}}
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
